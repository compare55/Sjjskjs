<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel</title><style>
body{font-family:Arial,sans-serif;background:#f5f6fa;color:#202533;margin:0;padding:14px}
.wrap{max-width:1200px;margin:auto}
.card{background:#fff;border:1px solid #ececf2;border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 8px 24px rgba(30,33,45,.06)}
input,button{padding:10px;border-radius:8px;border:1px solid #e2e4ea;margin:4px}
input{background:#fafbfc;color:#202533}
button{cursor:pointer;font-weight:700;border:0}
.ok{background:#ff416c;color:#fff}
.danger{background:#ef4444;color:#fff}
.green-btn{background:#22c55e;color:#fff}
.muted{color:#8b8e9a}
.table{overflow:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:9px;border-bottom:1px solid #ececf2;text-align:left;white-space:nowrap;font-size:12px}
.hidden{display:none}
.badge{padding:4px 8px;border-radius:6px;background:#fff0f4;color:#ef4268;font-size:10px;font-weight:900}
.vip-yes{background:#fff7e6;color:#d98200}
h2,h3{color:#202533}
</style></head>
<body>
<div class="wrap">
  <div class="card" id="login">
    <h2>🔐 Admin Login</h2>
    <input id="key" type="password" placeholder="ADMIN_KEY">
    <button class="ok" onclick="login()">Login</button>
    <p id="loginMsg"></p>
  </div>
  <div id="panel" class="hidden">
    <div class="card">
      <h2>👑 Admin Panel</h2>
      <button class="ok" onclick="loadAll()">🔄 Refresh</button>
      <button class="danger" onclick="logout()">Logout</button>
      <p id="msg" class="muted"></p>
    </div>
    <div class="card">
      <h3>👥 Users</h3>
      <input id="search" placeholder="Search name/mobile" oninput="renderUsers()">
      <div class="table"><table>
        <thead><tr><th>ID</th><th>Name</th><th>Mobile</th><th>Balance</th><th>VIP</th><th>Status</th><th>Action</th></tr></thead>
        <tbody id="users"></tbody>
      </table></div>
    </div>
    <div class="card">
      <h3>📥 Deposits</h3>
      <div class="table"><table>
        <thead><tr><th>ID</th><th>User</th><th>Amount</th><th>UTR</th><th>Status</th><th>Date</th><th>Action</th></tr></thead>
        <tbody id="deposits"></tbody>
      </table></div>
    </div>
    <div class="card">
      <h3>📤 Withdrawals</h3>
      <div class="table"><table>
        <thead><tr><th>ID</th><th>User</th><th>Amount</th><th>UPI</th><th>Status</th><th>Action</th></tr></thead>
        <tbody id="withdrawals"></tbody>
      </table></div>
    </div>
  </div>
</div>
<script src="config.js"></script>
<script>
let key = sessionStorage.getItem('adminKey') || '';
let allUsers = [];
function api(url, opt = {}) {
  opt.headers = { ...(opt.headers || {}), 'x-admin-key': key, 'Content-Type': 'application/json' };
  return fetch((window.GAME_API_URL || '').replace(/\/$/, '') + url, opt).then(async r => {
    const d = await r.json();
    if (!r.ok) throw new Error(d.message || 'Request failed');
    return d;
  });
}
function login() {
  key = document.getElementById('key').value;
  if (!key) return;
  api('/api/admin/users').then(d => { sessionStorage.setItem('adminKey', key); show(); allUsers = d.users; renderUsers(); loadAll(false); }).catch(e => document.getElementById('loginMsg').innerText = e.message);
}
function show() { document.getElementById('login').classList.add('hidden'); document.getElementById('panel').classList.remove('hidden'); }
function logout() { sessionStorage.removeItem('adminKey'); location.reload(); }
function renderUsers() {
  const q = (document.getElementById('search').value || '').toLowerCase();
  document.getElementById('users').innerHTML = allUsers.filter(u => u.name.toLowerCase().includes(q) || u.mobile.includes(q)).map(u => `<tr>
    <td>${u.id}</td><td>${u.name}</td><td>${u.mobile}</td><td>₹${Number(u.balance).toFixed(2)}</td>
    <td>${u.is_vip ? '<span class="badge vip-yes">⭐ VIP</span>' : '<span class="badge">—</span>'}</td>
    <td><span class="badge">${u.is_blocked ? 'BLOCKED' : 'ACTIVE'}</span></td>
    <td>${u.is_blocked ? `<button class="green-btn" onclick="toggleUser(${u.id},false)">Unblock</button>` : `<button onclick="toggleUser(${u.id},true)">Block</button>`}<button class="danger" onclick="deleteUser(${u.id})">Delete</button></td>
  </tr>`).join('') || '<tr><td colspan="7">No users</td></tr>';
}
async function toggleUser(id, block) { await api(`/api/admin/users/${id}/${block ? 'block' : 'unblock'}`, { method: 'POST' }); loadAll(); }
async function deleteUser(id) { if (!confirm('Delete this user?')) return; await api(`/api/admin/users/${id}`, { method: 'DELETE' }); loadAll(); }
async function loadAll(message = true) {
  try {
    const [u, d, w] = await Promise.all([api('/api/admin/users'), api('/api/admin/deposits'), api('/api/admin/withdrawals')]);
    allUsers = u.users; renderUsers();
    document.getElementById('deposits').innerHTML = d.deposits.map(x => {
      const isPending = x.status === 'PENDING';
      const color = x.status === 'APPROVED' ? '#22c55e' : (x.status === 'REJECTED' ? '#ef4444' : '#d98200');
      return `<tr><td>${x.id}</td><td>${x.name} (${x.mobile})</td><td>₹${x.amount}</td><td style="font-family:monospace;font-size:11px;">${x.utr_number || '-'}</td><td><span style="color:${color};font-weight:900;font-size:11px;">${x.status}</span></td><td>${new Date(x.created_at).toLocaleString()}</td><td>${isPending ? `<button class="green-btn" onclick="dep(${x.id},'approve')">✅ Verify</button><button class="danger" onclick="dep(${x.id},'reject')">❌ Reject</button>` : '-'}</td></tr>`;
    }).join('') || '<tr><td colspan="7">No deposits</td></tr>';
    document.getElementById('withdrawals').innerHTML = w.withdrawals.map(x => `<tr><td>${x.id}</td><td>${x.name} (${x.mobile})</td><td>₹${x.amount}</td><td>${x.upi_id || '-'}</td><td>${x.status}</td><td>${x.status === 'PENDING' ? `<button class="green-btn" onclick="wd(${x.id},'approve')">Approve</button><button class="danger" onclick="wd(${x.id},'reject')">Reject</button>` : '-'}</td></tr>`).join('') || '<tr><td colspan="6">No withdrawals</td></tr>';
    if (message) document.getElementById('msg').innerText = 'Updated ' + new Date().toLocaleTimeString();
  } catch (e) { document.getElementById('msg').innerText = e.message; }
}
async function dep(id, a) { await api(`/api/admin/deposits/${id}/${a}`, { method: 'POST' }); loadAll(); }
async function wd(id, a) { await api(`/api/admin/withdrawals/${id}/${a}`, { method: 'POST' }); loadAll(); }
if (key) { api('/api/admin/users').then(d => { show(); allUsers = d.users; renderUsers(); loadAll(false); }).catch(() => sessionStorage.removeItem('adminKey')); }
</script>
</body></html>
